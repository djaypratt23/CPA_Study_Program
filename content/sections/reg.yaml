# Taxation and Regulation (REG) — outline per the AICPA Uniform CPA Examination
# Blueprints effective 2026-01-01. See docs/BLUEPRINT_NOTES.md.
# Full section: every module, practice TBS, and a simulated exam are built.
id: REG
name: Taxation and Regulation
kind: core
status: full
blueprintEffective: '2026-01-01'
taxYear: '2025'
taxNote: >-
  Tax content reflects tax year 2025 law. OBBBA provisions effective in 2024–2025 are testable
  from July 1, 2026; later provisions follow the six-month rule. See docs/BLUEPRINT_NOTES.md.
description: >-
  Federal taxation of individuals, entities, and property transactions; tax procedures and ethics;
  and business law. Heavy on computing taxable amounts and applying rules to fact patterns.
exam:
  durationMinutes: 240
  testlets:
    - { kind: mcq, count: 36 }
    - { kind: mcq, count: 36 }
    - { kind: tbs, count: 2 }
    - { kind: tbs, count: 3 }
    - { kind: tbs, count: 3 }
  breakAfterTestlet: 3
  breakMinutes: 15
  weighting: { mcq: 50, tbs: 50 }
  passingScore: 75
skillAllocation:
  - { level: remembering, min: 25, max: 35 }
  - { level: application, min: 35, max: 45 }
  - { level: analysis, min: 25, max: 35 }
areas:
  - id: REG-I
    title: 'Area I: Ethics, Professional Responsibilities & Federal Tax Procedures'
    allocation: { min: 10, max: 20 }
    units:
      - id: reg-u1
        title: Ethics & Tax Procedures
        modules:
          - { id: reg-circular-230, title: 'Treasury Circular 230 & AICPA tax standards' }
          - { id: reg-preparer-penalties, title: 'Taxpayer and preparer penalties' }
          - { id: reg-irs-procedures, title: 'IRS audits, appeals & statute of limitations' }
          - { id: reg-accountant-liability, title: "Accountants' legal duties & liability" }
  - id: REG-II
    title: 'Area II: Business Law'
    allocation: { min: 15, max: 25 }
    units:
      - id: reg-u2
        title: Business Law
        modules:
          - { id: reg-agency, title: 'Agency' }
          - { id: reg-contracts, title: 'Contracts' }
          - { id: reg-debtor-creditor, title: 'Debtor-creditor relationships, secured transactions & bankruptcy' }
          - { id: reg-federal-regulation, title: 'Federal employment & securities regulation' }
          - { id: reg-business-structures, title: 'Business structures' }
  - id: REG-III
    title: 'Area III: Federal Taxation of Property Transactions'
    allocation: { min: 5, max: 15 }
    units:
      - id: reg-u3
        title: Property Transactions
        modules:
          - { id: reg-property-basis, title: 'Basis of property & gain or loss' }
          - { id: reg-capital-gains, title: 'Capital gains & losses, §1231 & recapture' }
          - { id: reg-nontaxable-exchanges, title: 'Like-kind exchanges, involuntary conversions & related-party rules' }
  - id: REG-IV
    title: 'Area IV: Federal Taxation of Individuals'
    allocation: { min: 22, max: 32 }
    units:
      - id: reg-u4
        title: Individual Income
        modules:
          - { id: reg-filing-status, title: 'Filing status & dependents' }
          - { id: reg-gross-income, title: 'Gross income: inclusions & exclusions' }
          - { id: reg-business-rental-income, title: 'Schedule C, rental income & passive activity limits' }
      - id: reg-u5
        title: Deductions, Credits & Tax Computation
        modules:
          - { id: reg-adjustments, title: 'Adjustments to income' }
          - { id: reg-itemized-deductions, title: 'Standard vs. itemized deductions & QBI' }
          - { id: reg-individual-credits, title: 'Individual tax credits' }
          - { id: reg-amt-other-taxes, title: 'AMT, self-employment tax & other taxes' }
  - id: REG-V
    title: 'Area V: Federal Taxation of Entities'
    allocation: { min: 23, max: 33 }
    units:
      - id: reg-u6
        title: Corporations
        modules:
          - { id: reg-c-corp-income, title: 'C corporation taxable income & book-tax reconciliation' }
          - { id: reg-corp-distributions, title: 'E&P and corporate distributions' }
          - { id: reg-corp-formation-liquidation, title: 'Formation (§351), redemptions & liquidations' }
      - id: reg-u7
        title: Flow-Through & Other Entities
        modules:
          - { id: reg-partnerships, title: 'Partnerships: formation, operations & basis' }
          - { id: reg-s-corporations, title: 'S corporations' }
          - { id: reg-trusts-exempt, title: 'Trusts, estates & tax-exempt organizations (overview)' }
