# Tax Compliance and Planning (TCP) — outline per the AICPA Uniform CPA Examination
# Blueprints effective 2026-01-01. See docs/BLUEPRINT_NOTES.md.
# Full section: every module, practice TBS, and a simulated exam are built.
id: TCP
name: Tax Compliance and Planning
kind: discipline
status: full
blueprintEffective: '2026-01-01'
taxYear: '2025'
taxNote: >-
  Tax content reflects tax year 2025 law. OBBBA provisions effective in 2024–2025 are testable
  from July 1, 2026; later provisions follow the six-month rule. See docs/BLUEPRINT_NOTES.md.
description: >-
  Advanced individual and entity tax compliance, entity tax planning, personal financial planning,
  and property transactions. Builds directly on REG; mostly application of rules to realistic facts.
exam:
  durationMinutes: 240
  testlets:
    - { kind: mcq, count: 34 }
    - { kind: mcq, count: 34 }
    - { kind: tbs, count: 2 }
    - { kind: tbs, count: 3 }
    - { kind: tbs, count: 2 }
  breakAfterTestlet: 3
  breakMinutes: 15
  weighting: { mcq: 50, tbs: 50 }
  passingScore: 75
skillAllocation:
  - { level: remembering, min: 5, max: 15 }
  - { level: application, min: 55, max: 65 }
  - { level: analysis, min: 25, max: 35 }
areas:
  - id: TCP-I
    title: 'Area I: Tax Compliance & Planning for Individuals and Personal Financial Planning'
    allocation: { min: 30, max: 40 }
    units:
      - id: tcp-u1
        title: Individual Compliance & Planning
        modules:
          - { id: tcp-individual-planning, title: 'Income timing, estimated tax & individual planning' }
          - { id: tcp-stock-compensation, title: 'Stock options & equity compensation' }
          - { id: tcp-passive-rental, title: 'Passive activities, rental property & at-risk rules' }
      - id: tcp-u2
        title: Gift Tax & Personal Financial Planning
        modules:
          - { id: tcp-gift-tax, title: 'Gift tax compliance (Form 709)' }
          - { id: tcp-retirement-education, title: 'Retirement & education savings planning' }
  - id: TCP-II
    title: 'Area II: Entity Tax Compliance'
    allocation: { min: 30, max: 40 }
    units:
      - id: tcp-u3
        title: C Corporations
        modules:
          - { id: tcp-c-corp-compliance, title: 'C corporation returns, Schedule M-1/M-3 & estimated tax' }
          - { id: tcp-consolidated-returns, title: 'Consolidated returns (overview)' }
      - id: tcp-u4
        title: Partnerships
        modules:
          - { id: tcp-partnership-formation, title: 'Partnership formation & partner basis' }
          - { id: tcp-partnership-operations, title: 'Partnership operations, allocations & Schedule K-1' }
          - { id: tcp-partnership-distributions, title: 'Partnership distributions & dispositions' }
      - id: tcp-u5
        title: S Corporations, Trusts & Exempt Organizations
        modules:
          - { id: tcp-s-corp-compliance, title: 'S corporation compliance, AAA & shareholder basis' }
          - { id: tcp-trusts-estates, title: 'Trusts & estates: fiduciary income tax' }
          - { id: tcp-exempt-organizations, title: 'Tax-exempt organizations & UBTI' }
  - id: TCP-III
    title: 'Area III: Entity Tax Planning'
    allocation: { min: 10, max: 20 }
    units:
      - id: tcp-u6
        title: Entity Planning
        modules:
          - { id: tcp-entity-choice, title: 'Choice of entity' }
          - { id: tcp-formation-liquidation, title: 'Corporate formation, distributions & liquidation planning' }
          - { id: tcp-multistate, title: 'Multistate taxation: nexus & apportionment' }
  - id: TCP-IV
    title: 'Area IV: Property Transactions (Disposition of Assets)'
    allocation: { min: 10, max: 20 }
    units:
      - id: tcp-u7
        title: Property Transactions
        modules:
          - { id: tcp-asset-dispositions, title: 'Sale of business assets: §1231, §1245 & §1250' }
          - { id: tcp-deferral-transactions, title: 'Installment sales, like-kind exchanges & related parties' }
          - { id: tcp-cost-recovery, title: 'Cost recovery planning (MACRS, §179, bonus)' }
