    - region "The big idea":
      - heading "The big idea" [level=2]
      - term: What it is
      - definition: The income statement tells the story of performance, ordered so a reader can separate what will likely recur (continuing operations) from what won't (discontinued operations). Comprehensive income then adds certain unrealized changes in value that GAAP keeps out of net income.
      - term: Why the rule exists
      - definition: Investors value a company mostly on its sustainable earnings. If a one-time sale of a division were mixed into operating results, a reader would project it forward and misjudge the company. Separation lets them forecast.
      - term: In the real world
      - definition: A retailer sells its entire restaurant division to exit food service. Next year the restaurants won't exist, so their results — and the loss on selling them — are shown below income from continuing operations, net of tax.
