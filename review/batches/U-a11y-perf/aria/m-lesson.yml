    - heading "Discontinued operations" [level=2]
    - paragraph: "Use the decision tree:"
    - figure:
      - img "Diagram":
        - document:
          - paragraph: "No"
          - paragraph: "Yes"
          - paragraph: "No"
          - paragraph: "Yes"
          - paragraph: "No"
          - paragraph: "Yes"
          - paragraph: Is it a component (operations and cash flows clearly distinguishable)?
          - paragraph: Not discontinued ops — report in continuing operations
          - paragraph: Disposed of, or classified as held for sale?
          - paragraph: Strategic shift with a major effect on operations and results? (e.g., major line of business, major geographic area, major equity-method investment)
          - paragraph: Discontinued operations — net of tax, below continuing operations
    - paragraph:
      - strong: Held for sale
      - text: requires, among other things, management commitment to a plan, availability for immediate sale, an active program to find a buyer, and a sale that is probable within one year. Held-for-sale assets are measured at the
      - strong: lower of carrying amount or fair value less cost to sell
      - text: and are not depreciated.
    - paragraph:
      - strong: "What goes in the discontinued-operations line (net of tax):"
    - list:
      - listitem:
        - text: The component's
        - strong: results of operations
        - text: for the period (income or loss), and
      - listitem:
        - text: The
        - strong: gain or loss on disposal
        - text: ", or, if still held for sale, any"
        - strong: impairment write-down
        - text: to fair value less cost to sell.
    - paragraph:
      - text: Prior periods presented are
      - strong: recast
      - text: so the component's results appear in discontinued operations for every year shown.
    - 'region "Worked example: Computing discontinued operations"':
      - text: Worked example
      - heading "Computing discontinued operations" [level=4]
      - paragraph: In Year 2, Summit Corp. commits to sell its European segment (a strategic shift). At year-end the segment is held for sale. The segment's pretax operating loss for Year 2 was $200,000. Its net assets have a carrying amount of $900,000 and a fair value less cost to sell of $750,000. The tax rate is 25%.
      - list:
        - listitem:
          - text: "Step 1: Operating results of the component"
          - paragraph: Pretax operating loss for the year.
          - text: → (200,000)
      - button "Show step 2 of 4"
      - button "Show all"
    - heading "Other comprehensive income" [level=2]
    - paragraph:
      - text: Some gains and losses bypass net income and go to
      - strong: other comprehensive income (OCI)
      - text: ", accumulating in"
      - strong: AOCI
      - text: in equity. The common exam list (mnemonic
      - strong: "\"PUFF\""
      - text: "):"
    - list:
      - listitem:
        - strong: P
        - text: ension and other postretirement items (actuarial gains/losses, prior service cost not yet in pension expense)
      - listitem:
        - strong: U
        - text: nrealized gains/losses on
        - strong: available-for-sale debt
        - text: securities (the non-credit portion)
      - listitem:
        - strong: F
        - text: oreign currency translation adjustments
      - listitem:
        - strong: F
        - text: air value changes in effective cash flow hedges — and the portion of a liability's fair value change due to own credit risk when the fair value option is elected
    - paragraph:
      - strong: "Not OCI:"
      - text: unrealized gains/losses on
      - strong: equity
      - text: securities (go to net income), trading debt securities (net income), and prior-period adjustments (retained earnings).
    - paragraph:
      - strong: "Presentation options:"
      - text: a single continuous statement of comprehensive income, or two consecutive statements (income statement immediately followed by a statement of comprehensive income). OCI items may be shown net of tax, or before tax with a single tax line.
    - paragraph:
      - strong: Reclassification adjustments.
      - text: When an AFS security with a previously recorded unrealized gain is sold, the gain is now
      - emphasis: realized
      - text: in net income. To avoid counting it twice in comprehensive income, it is removed from OCI ("recycled").
