    - heading "Foreign currency transactions" [level=2]
    - paragraph:
      - text: When an entity buys or sells on credit in a
      - strong: foreign currency
      - text: ", the receivable or payable is a"
      - strong: monetary item
      - text: that must be remeasured at each balance sheet date at the current (spot) rate. The change is a
      - strong: transaction gain or loss in net income
      - text: — not OCI (ASC 830-20).
    - 'region "Worked example: A euro payable"':
      - text: Worked example
      - heading "A euro payable" [level=4]
      - paragraph: On November 15, a U.S. company buys inventory for €100,000 on 60-day credit when €1 = $1.10. At December 31, €1 = $1.15. It pays on January 14, when €1 = $1.12.
      - list:
        - listitem:
          - text: "Step 1: Inventory and payable recorded"
          - paragraph: 100,000 × 1.10
          - text: → 110,000
      - button "Show step 2 of 3"
      - button "Show all"
    - paragraph:
      - text: "Nonmonetary items (inventory, PP&E, prepaid expenses) are not remeasured. Translation of a foreign subsidiary's statements is different: translation adjustments go to"
      - strong: OCI
      - text: (see above).
    - heading "Disaggregation of income statement expenses (ASU 2024-03)" [level=2]
    - paragraph:
      - text: "Public business entities must disclose, in a tabular note, how each relevant income statement expense caption breaks down into these natural categories:"
      - strong: purchases of inventory, employee compensation, depreciation, intangible asset amortization
      - text: ", and depletion (DD&A for extractive industries). They also disclose a qualitative description of amounts not separately disaggregated, the total of"
      - strong: selling expenses
      - text: and how the entity defines them. It is effective for annual periods beginning after December 15, 2026 (interim periods beginning after December 15, 2027).
    - region "Key takeaways":
      - heading "Key takeaways" [level=2]
      - list:
        - listitem: "Multiple-step order: net sales − COGS = gross profit; − operating expenses = operating income; ± other income/expense = income from continuing operations before tax; − tax; ± discontinued operations (net of tax) = net income."
        - listitem: Extraordinary items no longer exist. Unusual or infrequent items are shown as a separate line within continuing operations, pretax — never net of tax.
        - listitem: A discontinued operation is a component (or group) disposed of or held for sale whose disposal is a strategic shift with a major effect on operations and results.
        - listitem: Discontinued operations include the component's operating results for the period plus any gain/loss on disposal or write-down to fair value less cost to sell, all net of tax, for all periods presented.
        - listitem: Comprehensive income = net income + OCI. It can be one continuous statement or two consecutive statements; reclassification adjustments prevent double counting.
