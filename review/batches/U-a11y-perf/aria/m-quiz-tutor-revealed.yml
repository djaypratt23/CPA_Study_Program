        - paragraph: Continues to be depreciated over its remaining useful life
      - text: "Trap: Applies the wrong rule"
      - paragraph: Depreciation stops once an asset is classified as held for sale.
      - radio "B Must be sold within 90 days Your answer" [checked] [disabled]:
        - text: B
        - paragraph: Must be sold within 90 days
        - text: Your answer
      - text: "Trap: Uses an irrelevant number from the facts"
      - paragraph: The sale must generally be probable within one year.
      - radio "C Is measured at fair value, with gains above carrying amount recognized" [disabled]:
        - text: C
        - paragraph: Is measured at fair value, with gains above carrying amount recognized
      - text: "Trap: Overgeneralizes a rule"
      - paragraph: Gains are recognized only to the extent of previously recognized losses; it is not written up above carrying amount.
      - radio "D Carried at lower of carrying amount or FV less costs to sell Correct" [disabled]:
        - text: D
        - paragraph: Carried at lower of carrying amount or FV less costs to sell
        - text: Correct
      - paragraph: Correct. This is exactly the held-for-sale measurement rule.
    - text: Explanation
    - paragraph: "ASC 360-10-35: held-for-sale assets are measured at the lower of carrying amount or fair value less cost to sell, and depreciation ceases. Subsequent recoveries are recognized only up to cumulative losses previously recognized."
