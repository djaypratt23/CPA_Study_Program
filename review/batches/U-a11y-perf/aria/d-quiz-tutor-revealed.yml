  - article "A company presents OCI items before tax. Which presentation of related income taxes is acceptable?":
    - text: Question 1 of 10 Remembering & Understanding
    - button "Flag"
    - button "Note"
    - paragraph: A company presents OCI items before tax. Which presentation of related income taxes is acceptable?
    - status: Not quite — the answer is (A).
    - radiogroup "Answer choices":
      - radio "A A single amount for the aggregate income tax effect of OCI items, with the tax on each item disclosed Correct" [disabled]:
        - text: A
        - paragraph: A single amount for the aggregate income tax effect of OCI items, with the tax on each item disclosed
        - text: Correct
      - paragraph: Correct. Before-tax presentation with one aggregate tax line is permitted; the per-item tax effect is disclosed.
      - radio "B Taxes on OCI are recorded directly to retained earnings Your answer" [checked] [disabled]:
        - text: B
        - paragraph: Taxes on OCI are recorded directly to retained earnings
        - text: Your answer
      - text: "Trap: Misclassification"
      - paragraph: They are allocated to OCI, not retained earnings.
      - radio "C No tax effect is recognized on OCI items" [disabled]:
        - text: C
        - paragraph: No tax effect is recognized on OCI items
      - text: "Trap: Applies the wrong rule"
      - paragraph: OCI items have tax effects that must be allocated to them.
      - radio "D Income taxes on OCI are included in income tax expense on continuing operations" [disabled]:
        - text: D
        - paragraph: Income taxes on OCI are included in income tax expense on continuing operations
      - text: "Trap: Applies the wrong rule"
      - paragraph: Taxes follow the item (intraperiod allocation); OCI taxes are not in continuing-operations tax expense.
    - text: Explanation
    - paragraph: OCI components may be shown net of tax, or before tax with one line for the aggregate tax effect. Either way, the tax effect of each component is disclosed (ASC 220-10-45).
