- main:
  - link "← Back":
    - /url: "#/tbs?unit=far-u10"
  - heading "Income tax provision — Garrick Corp." [level=1]
  - paragraph: Income Taxes & Fair Value · suggested 20 min
  - text: 00:00
  - button "Calculator"
  - button "Spreadsheet"
  - paragraph:
    - text: Prepare Garrick Corp.'s Year 1 income tax provision. The enacted rate is
    - strong: 25%
    - text: for all years. There were no deferred tax balances at the start of the year, and no valuation allowance is needed.
  - paragraph: The exhibits are in the panel on the right.
  - paragraph: Compute the following.
  - text: Taxable income
  - textbox "Taxable income":
    - /placeholder: "0"
  - text: Current tax expense
  - textbox "Current tax expense":
    - /placeholder: "0"
  - text: Deferred tax liability at year-end
  - textbox "Deferred tax liability at year-end":
    - /placeholder: "0"
  - text: Deferred tax asset at year-end
  - textbox "Deferred tax asset at year-end":
    - /placeholder: "0"
  - text: Total income tax expense
  - textbox "Total income tax expense":
    - /placeholder: "0"
  - text: Effective tax rate (percent points)
  - textbox "Effective tax rate (percent points)":
    - /placeholder: "0"
  - text: "%"
  - paragraph: Enter whole dollars unless the row shows another unit. Enter percentages as percent points (25 or 25% for 25%). Commas and $ are fine; use a minus sign or (parentheses) for negatives.
  - paragraph: Record the Year 1 income tax provision.
